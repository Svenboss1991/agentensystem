<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lupita">
  <title>Lupita</title>
  <!-- Arme nach oben, Hände auf dem Kopf (wie beim Plüsch-Orang-Utan) -->
  <path d="M13 40 C 6 26, 18 10, 29 9" fill="none" stroke="#8a3f16" stroke-width="8" stroke-linecap="round"/>
  <path d="M51 40 C 58 26, 46 10, 35 9" fill="none" stroke="#8a3f16" stroke-width="8" stroke-linecap="round"/>
  <!-- Kopf, zottelig -->
  <circle cx="32" cy="34" r="19" fill="#a24f1d"/>
  <path d="M15 30 l-3 -3 l4 0 l-2 -4 l4 1 M49 30 l3 -3 l-4 0 l2 -4 l-4 1" fill="none" stroke="#a24f1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hände -->
  <ellipse cx="29" cy="9" rx="5" ry="4" fill="#b9764a"/>
  <ellipse cx="35" cy="9" rx="5" ry="4" fill="#c4865a"/>
  <!-- Gesicht -->
  <ellipse cx="25.5" cy="31" rx="7" ry="6.5" fill="#d9a777"/>
  <ellipse cx="38.5" cy="31" rx="7" ry="6.5" fill="#d9a777"/>
  <ellipse cx="32" cy="42" rx="12" ry="8.5" fill="#f3dcb8"/>
  <!-- Augen -->
  <circle cx="25.5" cy="31" r="4.2" fill="#f7ecd6" stroke="#c99a68" stroke-width="1.2"/>
  <circle cx="38.5" cy="31" r="4.2" fill="#f7ecd6" stroke="#c99a68" stroke-width="1.2"/>
  <circle cx="26" cy="31.5" r="2.4" fill="#2a1a10"/>
  <circle cx="38" cy="31.5" r="2.4" fill="#2a1a10"/>
  <circle cx="26.8" cy="30.6" r="0.8" fill="#fff"/>
  <circle cx="38.8" cy="30.6" r="0.8" fill="#fff"/>
  <!-- Nase und Lächeln -->
  <circle cx="30.3" cy="39" r="0.9" fill="#7a4a2a"/>
  <circle cx="33.7" cy="39" r="0.9" fill="#7a4a2a"/>
  <path d="M26 44 Q 32 48.5 38 44" fill="none" stroke="#7a4a2a" stroke-width="1.4" stroke-linecap="round"/>
</svg>
